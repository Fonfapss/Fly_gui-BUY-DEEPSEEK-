name: NeoForge Create Artifacts

on:
  workflow_dispatch: {}
  push:
    branches: [ main, codex/** ]

jobs:
  build:
    name: Create Minecraft Artifacts (NeoForm)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run NeoForm createMinecraftArtifacts
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: '9.2.1'
          arguments: createMinecraftArtifacts --no-daemon --stacktrace

      - name: Upload NeoForm artifacts
        uses: actions/upload-artifact@v4
        with:
          name: neoform-artifacts
          path: |
            build/moddev/artifacts/**
            build/libs/**
